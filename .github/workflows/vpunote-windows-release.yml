name: vpunote-windows-release

# VPUNote for Windows on its own: each push to the VPUNote branch that touches the Windows app (or
# Actions › Run workflow) tests and builds the x64 app and publishes it as a pre-release tagged
# vpunote-v<VERSION>-<run number>, with VPUNote-<version>-Windows-x64.exe and checksums.txt.
# The full release.yml (every platform, tag = VERSION) is untouched.
on:
  push:
    branches: ["claude/laughing-ritchie-tx3iyj"]
    paths: ["windows/**", ".github/workflows/vpunote-windows-release.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Test
        shell: pwsh
        run: |
          dotnet build windows/tests/VPUNote.Tests -o windows/build/tests
          windows/build/tests/VPUNote.Tests.exe
          if ($LASTEXITCODE -ne 0) { exit 1 }
      - name: Build
        shell: pwsh
        run: |
          $v = "$((Get-Content VERSION -Raw).Trim())-$env:GITHUB_RUN_NUMBER"
          "TAG=vpunote-v$v" | Out-File -Append $env:GITHUB_ENV
          $build = "$((Get-Content VERSION -Raw).Trim()).$env:GITHUB_RUN_NUMBER"
          dotnet publish windows/src/VPUNote -c Release -r win-x64 -o out -p:DebugType=embedded -p:Version=$build
          if ($LASTEXITCODE -ne 0) { exit 1 }
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item out/VPUNote.exe "dist/VPUNote-$v-Windows-x64.exe"
          Get-ChildItem dist/*.exe | ForEach-Object { "$((Get-FileHash $_ -Algorithm SHA256).Hash.ToLower())  $($_.Name)" } | Set-Content dist/checksums.txt
      - name: Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $notes = "VPUNote cho Windows 64-bit: giao diện Tiếng Việt (mặc định), English, Русский, 简体中文, 日本語, 한국어; dịch vụ AI OpenRouter, Google Gemini hoặc địa chỉ tương thích OpenAI; dịch dự phòng Google miễn phí.`n`nTải VPUNote-*-Windows-x64.exe, chạy và chọn More info › Run anyway (chưa ký số)."
          gh release create "$env:TAG" dist/* --repo "$env:GITHUB_REPOSITORY" --title "VPUNote $env:TAG (Windows x64)" --notes $notes --prerelease --target "$env:GITHUB_SHA"
